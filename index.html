<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>すいすいスケッチ</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: full-bleed canvas tank; a collapsible tray floats bottom-left. Single deep-water look on purpose (it is a screen to project on a monitor). */
:root {
  --water-top: #0e5d7a;
  --water-deep: #06243b;
  --sand: #d9c08a;
  --panel: rgba(6, 30, 48, .82);
  --panel-line: rgba(160, 220, 235, .22);
  --ink: #eaf7fb;
  --ink-soft: #a9cfdb;
  --accent: #ffcf5a;
  --danger: #ff8c7a;
  --font-display: "Kiwi Maru", "Hiragino Maru Gothic ProN", "Zen Kaku Gothic New", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--water-deep); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#tank { display: block; width: 100%; height: 100%; touch-action: manipulation; cursor: pointer; }

.tray {
  position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(360px, calc(100vw - 32px));
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 18px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  padding: 16px; display: grid; gap: 12px;
  transition: opacity .3s, transform .3s;
}
.tray.hide { opacity: 0; transform: translateY(12px); pointer-events: none; }
.tray h1 { font-family: var(--font-display); font-weight: 500; font-size: 22px; margin: 0; letter-spacing: .04em; }
.tray p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink-soft); }
.drop {
  border: 2px dashed var(--panel-line); border-radius: 14px; padding: 14px;
  display: grid; gap: 6px; justify-items: center; text-align: center; cursor: pointer; position: relative;
  transition: border-color .2s, background .2s;
}
.drop:hover, .drop.over { border-color: var(--accent); background: rgba(255, 207, 90, .08); }
.drop strong { font-family: var(--font-display); font-weight: 500; font-size: 16px; color: var(--accent); }
.drop span { font-size: 12px; color: var(--ink-soft); }
/* the real file input covers the drop zone so a finger tap lands on it directly (needed on phones) */
.picker { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row label { font-size: 12px; color: var(--ink-soft); }
input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
button {
  font: inherit; font-size: 13px; color: var(--ink); background: rgba(255,255,255,.08);
  border: 1px solid var(--panel-line); border-radius: 999px; padding: 7px 14px; cursor: pointer;
}
button:hover { background: rgba(255,255,255,.16); }
button:focus-visible, .drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: #2b2000; border-color: transparent; font-weight: 700; }
.list { display: grid; gap: 6px; max-height: 28vh; overflow-y: auto; }
.item { display: flex; align-items: center; gap: 8px; padding: 4px; border-radius: 10px; background: rgba(255,255,255,.04); }
.item img { width: 44px; height: 44px; object-fit: contain; flex: none; background: rgba(255,255,255,.06); border-radius: 8px; }
.item .name { flex: 1; min-width: 0; font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item button { padding: 4px 9px; font-size: 12px; }
.item .name.life { font-size: 12px; line-height: 1.4; color: var(--accent); white-space: normal; font-variant-numeric: tabular-nums; }
.item button.del { color: var(--danger); }
.count { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.show-btn {
  position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  opacity: .35; background: var(--panel);
}
.show-btn:hover { opacity: 1; }
@media (max-width: 480px) { .tray { padding: 12px; } .tray h1 { font-size: 19px; } }
</style>

<div id="stage">
  <canvas id="tank" aria-label="絵が泳ぐ水槽"></canvas>
</div>

<section class="tray" id="tray">
  <h1>すいすいスケッチ</h1>
  <p>スキャンした絵や写真を入れると、白い紙の部分を消して水槽で泳ぎます。お魚をタッチするとジャンプして逃げます。水をタッチすると近くのお魚が見に来ます。30秒ごとにお客さん（マンボウ、カニ、マンタなど）が通りかかります。入れた絵は3分たつとサメが食べに来ます。</p>
  <label class="drop" id="drop" tabindex="0">
    <strong>絵を入れる</strong>
    <span>ここをタップ、または画像をドラッグ（複数OK）</span>
    <input type="file" id="file" accept="image/*" multiple class="picker" aria-label="絵を入れる">
  </label>  <div class="row">
    <label for="tol">紙の白を消す強さ</label>
    <input type="range" id="tol" min="10" max="120" value="55">
  </div>
  <div class="list" id="list"></div>
  <div class="row">
    <button class="primary" id="fs">全画面で表示</button>
    <button id="hideTray">パネルを隠す</button>
    <span class="count" id="count"></span>
  </div>
</section>
<button class="show-btn" id="showTray" hidden>パネル</button>

<script>
(() => {
const cv = document.getElementById('tank'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildScenery();
}
addEventListener('resize', resize);

/* ---------- scenery ---------- */
let weeds = [], rocks = [];
function buildScenery() {
  const n = Math.max(4, Math.round(W / 140));
  weeds = Array.from({length: n}, (_, i) => ({
    x: (i + .3 + Math.random() * .4) * W / n,
    h: H * (.18 + Math.random() * .22),
    hue: 120 + Math.random() * 40, ph: Math.random() * 6
  }));
  rocks = Array.from({length: Math.round(n * .8)}, () => ({
    x: Math.random() * W, r: 14 + Math.random() * 30, s: 30 + Math.random() * 20
  }));
}
const bubbles = [];
function drawBackground(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1580a0'); g.addColorStop(.45, '#0b4d6c'); g.addColorStop(1, '#06243b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // light rays
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const x = (i / 5) * W + Math.sin(t * .0002 + i) * 60;
    const rg = ctx.createLinearGradient(0, 0, 0, H * .8);
    rg.addColorStop(0, 'rgba(180,240,255,.10)'); rg.addColorStop(1, 'rgba(180,240,255,0)');
    ctx.fillStyle = rg; ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x + 70, 0); ctx.lineTo(x + 220, H * .8); ctx.lineTo(x + 90, H * .8); ctx.fill();
  }
  ctx.restore();
  // sand
  const sy = H * .9;
  ctx.fillStyle = '#c9ad74';
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, sy + Math.sin(x * .012) * 8);
  ctx.lineTo(W, H); ctx.fill();
  for (const r of rocks) {
    ctx.fillStyle = `hsl(200,12%,${r.s}%)`;
    ctx.beginPath(); ctx.ellipse(r.x, sy + 10, r.r, r.r * .6, 0, Math.PI, 0); ctx.fill();
  }
  // weeds
  for (const w of weeds) {
    ctx.strokeStyle = `hsl(${w.hue},45%,32%)`; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(w.x, sy + 6);
    const seg = 8;
    for (let i = 1; i <= seg; i++) {
      const k = i / seg, sw = reduce ? 0 : Math.sin(t * .0012 + w.ph + k * 2.4) * 18 * k;
      ctx.lineTo(w.x + sw, sy - w.h * k);
    }
    ctx.stroke();
  }
}
function drawBubbles(dt) {
  if (!reduce && Math.random() < .08) bubbles.push({x: Math.random() * W, y: H, r: 2 + Math.random() * 6, v: 25 + Math.random() * 40, ph: Math.random() * 6});
  ctx.strokeStyle = 'rgba(220,250,255,.55)'; ctx.lineWidth = 1.5;
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i]; b.y -= b.v * dt; b.ph += dt * 3;
    ctx.beginPath(); ctx.arc(b.x + Math.sin(b.ph) * 4, b.y, b.r, 0, 7); ctx.stroke();
    if (b.y < -10) bubbles.splice(i, 1);
  }
}

/* ---------- creatures ---------- */
const creatures = [];
let uid = 0, clock = 0; // clock = seconds the tank has been running (pauses while the page is hidden)
const LIFE = 180;          // drawings you add are eaten by the shark after 3 minutes
const VISIT_EVERY = 30;    // a visitor passes through every 30 seconds
const FIRST_VISIT = 10;
const FAST = Math.max(1, +new URLSearchParams(location.search).get('fast') || 1); // ?fast=30 to try the timers quickly
const MODES = [['swim', '泳ぐ'], ['float', 'ふわふわ'], ['hop', 'はねる']];
function addCreature(img, name, opts = {}) {
  const base = Math.min(W, H) * (opts.scale || .2);
  const ar = img.width / img.height;
  const w = ar >= 1 ? base : base * ar, h = ar >= 1 ? base / ar : base;
  const c = {
    id: ++uid, img, name, w, h, mode: opts.mode || 'swim', flip: !!opts.flip,
    x: Math.random() * (W - w) + w / 2, y: H * (.2 + Math.random() * .5),
    vx: (Math.random() < .5 ? -1 : 1) * (40 + Math.random() * 40), vy: 0,
    ph: Math.random() * 6, jump: 0, turn: 0, dir: 1,
    user: !!opts.user, born: clock, fear: false
  };
  c.dir = Math.sign(c.vx);
  if (opts.at) {
    c.x = Math.min(W - w / 2, Math.max(w / 2, opts.at.x + (Math.random() - .5) * 60));
    c.y = Math.min(H * .9 - h / 2, Math.max(H * .08 + h / 2, opts.at.y + (Math.random() - .5) * 60));
    c.jump = 1;
  }
  creatures.push(c); renderList();
}
function update(c, dt, t) {
  const floor = H * .9, top = H * .08;
  c.ph += dt;
  if (c.jump > 0) c.jump = Math.max(0, c.jump - dt * 1.6);
  if (c.fear) { // the shark is coming: freeze and tremble
    c.x += Math.sin(c.ph * 60) * 1.2; c.vx = Math.sign(c.vx) * 10; c.vy = 0;
    c.dir += ((Math.sign(c.vx) || 1) - c.dir) * Math.min(1, dt * 5);
    return;
  }
  if (c.spin > 0) c.spin = Math.max(0, c.spin - dt * 1.4);
  c.boost = Math.max(0, (c.boost || 0) - dt * 2.5);
  const sp = 1 + c.boost; // speed burst after being tapped
  const tg = c.target;
  if (tg) { // come over to look at the ripple
    tg.t -= dt;
    const dx = tg.x - c.x, dy = tg.y - c.y, d = Math.hypot(dx, dy);
    if (tg.t <= 0 || d < Math.max(c.w, c.h) * .4) c.target = null;
    else {
      c.vx = Math.sign(dx) * Math.max(70, Math.abs(c.vx));
      if (c.mode !== 'hop') c.vy += (dy / d * 140 - c.vy) * Math.min(1, dt * 3);
    }
  }
  if (c.mode === 'swim') {
    if (!tg && Math.random() < dt * .25) c.vy = (Math.random() - .5) * 60;
    if (!tg && !c.boost && Math.random() < dt * .08) c.vx *= -1;
    c.x += c.vx * sp * dt; c.y += c.vy * dt + Math.sin(c.ph * 2) * 10 * dt;
  } else if (c.mode === 'float') {
    c.x += c.vx * (tg ? .8 : .35) * sp * dt;
    c.y += (tg ? c.vy * .6 : Math.sin(c.ph * 1.3) * 40 - 6) * dt;
    if (!tg && !c.boost && Math.random() < dt * .05) c.vx *= -1;
  } else { // hop
    c.vy += 600 * dt; c.x += c.vx * sp * dt; c.y += c.vy * dt;
    if (c.y + c.h / 2 > floor) { c.y = floor - c.h / 2; c.vy = -(260 + Math.random() * 160); }
  }
  if (c.x - c.w / 2 < 0) { c.x = c.w / 2; c.vx = Math.abs(c.vx); }
  if (c.x + c.w / 2 > W) { c.x = W - c.w / 2; c.vx = -Math.abs(c.vx); }
  if (c.mode !== 'hop') {
    if (c.y - c.h / 2 < top) { c.y = top + c.h / 2; c.vy = Math.abs(c.vy); }
    if (c.y + c.h / 2 > floor) { c.y = floor - c.h / 2; c.vy = -Math.abs(c.vy); }
  }
  const want = Math.sign(c.vx) || 1;
  c.dir += (want - c.dir) * Math.min(1, dt * 5); // smooth turn (squash through 0)
}
function draw(c, t) {
  const wob = reduce ? 0 : Math.sin(c.ph * (c.mode === 'swim' ? 7 : 3));
  const jumpY = -Math.sin(c.jump * Math.PI) * c.h * .8;
  let sx = c.dir * (c.flip ? -1 : 1), sy = 1, rot = 0;
  if (c.mode === 'swim') { rot = Math.atan2(c.vy, Math.abs(c.vx)) * .4 * Math.sign(c.vx) + wob * .04; sx *= 1 + wob * .04; }
  else if (c.mode === 'float') { sy = 1 + wob * .06; sx *= 1 - wob * .04; }
  else { const sq = c.vy < 0 ? 1.06 : .97; sy = sq; sx *= 2 - sq; }
  ctx.save();
  ctx.translate(c.x, c.y + jumpY); ctx.rotate(rot + (1 - (c.spin || 0)) * (c.spin > 0 ? Math.PI * 2 : 0) * (c.vx > 0 ? 1 : -1)); ctx.scale(sx, sy);
  ctx.shadowColor = 'rgba(0,10,20,.35)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 8;
  ctx.drawImage(c.img, -c.w / 2, -c.h / 2, c.w, c.h);
  ctx.restore();
}
let last = performance.now();
function loop(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  clock += dt * FAST;
  drawBackground(t);
  scheduleVisitors();
  checkShark();
  drawVisitors(dt, 'back');
  for (const c of creatures) { update(c, dt, t); draw(c, t); }
  drawVisitors(dt, 'front'); drawFx(dt);
  updateShark(dt);
  drawRipples(dt); drawBubbles(dt); drawPops(dt);
  requestAnimationFrame(loop);
}

/* tap a creature -> it jumps, spins and darts away. tap empty water -> ripple, and nearby creatures come to look */
let spawnAt = null;
const ripples = [];
function hit(px, py) {
  for (let i = creatures.length - 1; i >= 0; i--) { // topmost first
    const c = creatures[i], pad = 24; // generous for small fingers
    const cy = c.y - Math.sin(c.jump * Math.PI) * c.h * .8;
    if (Math.abs(px - c.x) < c.w / 2 + pad && Math.abs(py - cy) < c.h / 2 + pad) return c;
  }
  return null;
}
cv.addEventListener('pointerdown', e => {
  // panel open: a tap outside it just closes the panel
  const tr = document.getElementById('tray');
  if (!tr.classList.contains('hide')) { tr.classList.add('hide'); document.getElementById('showTray').hidden = false; return; }
  const px = e.clientX, py = e.clientY, c = hit(px, py);
  for (let k = 0; k < (c ? 16 : 8); k++) bubbles.push({x: px + (Math.random() - .5) * 30, y: py, r: 2 + Math.random() * 6, v: 50 + Math.random() * 80, ph: Math.random() * 6});
  if (!c && (tapEels(px, py) || tapCrab(px, py) || tapVisitors(px, py))) return;
  if (c) {
    c.jump = 1; c.spin = 1; c.target = null;
    const away = Math.sign(c.x - px) || (Math.random() < .5 ? -1 : 1);
    c.vx = away * Math.max(Math.abs(c.vx), 60); c.boost = 3.5;
    if (c.mode === 'hop') c.vy = -520;
  } else {
    ripples.push({x: px, y: py, a: 1});
    const R = Math.max(W, H) * .45;
    for (const o of creatures) if (Math.hypot(o.x - px, o.y - py) < R) o.target = {x: px, y: py, t: 2.2};
  }
});
function drawRipples(dt) {
  ctx.lineWidth = 2;
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i]; r.a -= dt * 1.2;
    if (r.a <= 0) { ripples.splice(i, 1); continue; }
    ctx.strokeStyle = `rgba(220,250,255,${r.a * .7})`;
    for (const k of [1, .6]) { ctx.beginPath(); ctx.arc(r.x, r.y, (1 - r.a) * 70 * k + 4, 0, 7); ctx.stroke(); }
  }
}

/* ---------- visitors: one creature passes through every minute ---------- */
function sprite(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.lineCap = x.lineJoin = 'round'; fn(x); return c; }
const SPR = {
  squid: sprite(140, 280, x => { // points up
    x.strokeStyle = '#a14d7c'; x.lineWidth = 5;
    x.fillStyle = '#f7dbe9';
    for (let i = 0; i < 8; i++) { const sx = 34 + i * 10; x.beginPath(); x.moveTo(sx, 140); x.bezierCurveTo(sx - 14, 190, sx + 14, 230, sx - 4 + (i % 2) * 8, 270); x.stroke(); }
    x.beginPath(); x.moveTo(70, 6); x.quadraticCurveTo(112, 70, 104, 150); x.lineTo(36, 150); x.quadraticCurveTo(28, 70, 70, 6); x.fill(); x.stroke();
    x.beginPath(); x.moveTo(70, 8); x.lineTo(130, 52); x.lineTo(92, 64); x.closePath(); x.fill(); x.stroke();
    x.beginPath(); x.moveTo(70, 8); x.lineTo(10, 52); x.lineTo(48, 64); x.closePath(); x.fill(); x.stroke();
    x.fillStyle = '#e88fb8'; for (const [a, b] of [[60, 70], [82, 95], [58, 112], [80, 128]]) { x.beginPath(); x.arc(a, b, 5, 0, 7); x.fill(); }
    x.fillStyle = '#222'; x.beginPath(); x.arc(50, 140, 7, 0, 7); x.arc(90, 140, 7, 0, 7); x.fill();
  }),
  mola: sprite(280, 320, x => { // faces right
    x.fillStyle = '#a9bccf'; x.strokeStyle = '#3e5266'; x.lineWidth = 6;
    x.beginPath(); x.moveTo(125, 75); x.lineTo(160, 6); x.lineTo(190, 80); x.fill(); x.stroke();
    x.beginPath(); x.moveTo(125, 245); x.lineTo(160, 314); x.lineTo(190, 240); x.fill(); x.stroke();
    x.beginPath(); for (let i = 0; i <= 5; i++) { const y = 90 + i * 28; i ? x.quadraticCurveTo(4, y - 14, 30, y) : x.moveTo(30, y); } x.lineTo(60, 230); x.lineTo(60, 90); x.fill(); x.stroke();
    x.beginPath(); x.ellipse(150, 160, 112, 100, 0, 0, 7); x.fill(); x.stroke();
    x.fillStyle = '#dfe8f0'; x.beginPath(); x.ellipse(165, 200, 80, 40, 0, 0, 7); x.fill();
    x.fillStyle = '#fff'; x.beginPath(); x.arc(222, 135, 14, 0, 7); x.fill(); x.fillStyle = '#222'; x.beginPath(); x.arc(226, 135, 7, 0, 7); x.fill();
    x.strokeStyle = '#3e5266'; x.lineWidth = 4; x.beginPath(); x.arc(254, 165, 8, 0, 7); x.stroke();
    x.beginPath(); x.moveTo(205, 170); x.quadraticCurveTo(198, 185, 205, 200); x.stroke();
  }),
  turtle: sprite(280, 190, x => { // faces right
    x.fillStyle = '#b5d17a'; x.strokeStyle = '#3c5a24'; x.lineWidth = 5;
    for (const [cx, cy, r] of [[180, 45, -.6], [180, 145, .6], [70, 55, .7], [70, 135, -.7]]) { x.beginPath(); x.ellipse(cx, cy, 45, 16, r, 0, 7); x.fill(); x.stroke(); }
    x.beginPath(); x.ellipse(235, 95, 30, 24, 0, 0, 7); x.fill(); x.stroke();
    x.fillStyle = '#5f9e4f'; x.beginPath(); x.ellipse(135, 95, 88, 58, 0, 0, 7); x.fill(); x.stroke();
    x.strokeStyle = '#a9d48c'; x.lineWidth = 4;
    x.beginPath(); x.moveTo(110, 70); x.lineTo(160, 70); x.lineTo(175, 95); x.lineTo(160, 120); x.lineTo(110, 120); x.lineTo(95, 95); x.closePath(); x.stroke();
    for (const [a, b, c, d] of [[110, 70, 90, 45], [160, 70, 180, 45], [110, 120, 90, 145], [160, 120, 180, 145], [95, 95, 50, 95], [175, 95, 222, 95]]) { x.beginPath(); x.moveTo(a, b); x.lineTo(c, d); x.stroke(); }
    x.fillStyle = '#222'; x.beginPath(); x.arc(246, 88, 5, 0, 7); x.fill();
  }),
  seahorse: sprite(200, 320, x => { // faces right
    const body = '#f6b73c', line = '#8a5a10';
    x.fillStyle = body; x.strokeStyle = line;
    // curled tail
    x.lineWidth = 30; x.strokeStyle = line; x.beginPath(); x.moveTo(110, 210); x.bezierCurveTo(105, 275, 55, 300, 50, 268); x.stroke();
    x.lineWidth = 22; x.strokeStyle = body; x.beginPath(); x.moveTo(110, 210); x.bezierCurveTo(105, 275, 55, 300, 50, 268); x.stroke();
    x.lineWidth = 16; x.strokeStyle = line; x.beginPath(); x.arc(70, 262, 19, Math.PI, Math.PI * 2.6); x.stroke();
    x.lineWidth = 9; x.strokeStyle = body; x.beginPath(); x.arc(70, 262, 19, Math.PI, Math.PI * 2.6); x.stroke();

  }, 240, 180), {mode: 'swim', flip: false}],
  ['見本：くらげ', crayon(x => {
    x.fillStyle = '#f2a8e0'; x.beginPath(); x.arc(100, 90, 70, Math.PI, 0); x.quadraticCurveTo(100, 110, 30, 90); x.fill();
    x.strokeStyle = '#8a3c79'; x.lineWidth = 6; x.stroke();
    x.lineWidth = 5; for (let i = 0; i < 5; i++) { const sx = 45 + i * 27; x.beginPath(); x.moveTo(sx, 98); x.bezierCurveTo(sx - 15, 140, sx + 15, 170, sx, 210); x.stroke(); }
    x.fillStyle = '#222'; x.beginPath(); x.arc(80, 65, 6, 0, 7); x.arc(120, 65, 6, 0, 7); x.fill();
    x.fillStyle = '#ff7aa8'; x.globalAlpha = .6; x.beginPath(); x.arc(68, 80, 9, 0, 7); x.arc(132, 80, 9, 0, 7); x.fill();
  }, 200, 220), {mode: 'float'}],
  ['見本：あおい魚', crayon(x => {
    x.fillStyle = '#5ab4ff'; jitterPath(x, [[20,80],[80,25],[170,40],[210,80],[170,120],[80,135]], true); x.fill();
    x.strokeStyle = '#123f6b'; x.lineWidth = 6; x.stroke();
    x.fillStyle = '#5ab4ff'; jitterPath(x, [[25,80],[2,45],[2,115]], true); x.fill(); x.stroke();
    x.fillStyle = '#ffd94a'; for (const [a, b] of [[90,70],[120,95],[130,60],[100,105]]) { x.beginPath(); x.arc(a, b, 8, 0, 7); x.fill(); }
    x.fillStyle = '#222'; x.beginPath(); x.arc(178, 70, 7, 0, 7); x.fill();
  }, 220, 160), {mode: 'swim', flip: false, small: true}],
];

/* ---------- tray UI ---------- */
const list = document.getElementById('list'), count = document.getElementById('count');
const tol = document.getElementById('tol');
function renderList() {
  list.innerHTML = '';
  for (const c of creatures) {
    const row = document.createElement('div'); row.className = 'item';
    const im = new Image(); im.src = c.img.toDataURL ? c.img.toDataURL() : c.img.src; im.alt = '';
    const nm = document.createElement('span'); nm.className = 'name'; nm.textContent = c.name;
    if (c.user) { nm.textContent = ''; nm.classList.add('life'); c.lifeEl = nm; } // added drawings: no file name, just the time left
    const md = document.createElement('button'); md.textContent = MODES.find(m => m[0] === c.mode)[1];
    md.title = '動き方を変える';
    md.onclick = () => { const i = MODES.findIndex(m => m[0] === c.mode); c.mode = MODES[(i + 1) % 3][0]; c.vy = 0; md.textContent = MODES[(i + 1) % 3][1]; };
    const fl = document.createElement('button'); fl.textContent = '向き'; fl.title = '左右の向きを反転';
    fl.onclick = () => { c.flip = !c.flip; };
    const bg = document.createElement('button'); bg.textContent = '大'; bg.title = '大きさを変える';
    const sizes = [1, 1.4, .7]; let si = 0;
    bg.onclick = () => { const prev = sizes[si]; si = (si + 1) % 3; const k = sizes[si] / prev; c.w *= k; c.h *= k; bg.textContent = ['大','小','中'][si]; };
    const del = document.createElement('button'); del.className = 'del'; del.textContent = '×'; del.title = 'この絵を外す';
    del.onclick = () => { creatures.splice(creatures.indexOf(c), 1); originals.delete(c.id); renderList(); };
    row.append(im, nm, md, fl, bg, del); list.append(row);
  }
  count.textContent = `${creatures.length}ひき`;
  updateLife();
}
function updateLife() {
  for (const c of creatures) {
    if (!c.lifeEl) continue;
    const left = Math.ceil(LIFE - (clock - c.born));
    c.lifeEl.textContent = left > 0 ? `サメが来るまで ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}` : 'サメが来た！';
  }
}
setInterval(updateLife, 1000);
tol.addEventListener('change', () => {
  for (const c of creatures) {
    const src = originals.get(c.id); if (!src) continue;
    const k = c.w / c.img.width; c.img = cutOut(src, +tol.value);
    const base = Math.max(c.w, c.h), ar = c.img.width / c.img.height;
    c.w = ar >= 1 ? base : base * ar; c.h = ar >= 1 ? base / ar : base;
  }
  renderList();
});

const drop = document.getElementById('drop'), file = document.getElementById('file');
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } });
file.addEventListener('change', () => { loadFiles(file.files); file.value = ''; });
['dragenter', 'dragover'].forEach(ev => addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
addEventListener('drop', e => { if (e.dataTransfer?.files?.length) loadFiles(e.dataTransfer.files); });
addEventListener('paste', e => { const fs = [...(e.clipboardData?.files || [])]; if (fs.length) loadFiles(fs); });

const tray = document.getElementById('tray'), showBtn = document.getElementById('showTray');
function setTray(open) { tray.classList.toggle('hide', !open); showBtn.hidden = open; }
document.getElementById('hideTray').onclick = () => setTray(false);
showBtn.onclick = () => setTray(true);
addEventListener('keydown', e => { if (e.key === 'h' || e.key === 'H') setTray(tray.classList.contains('hide')); });

let wake = null;
document.getElementById('fs').onclick = async () => {
  try { await document.documentElement.requestFullscreen(); setTray(false); } catch (_) { setTray(false); }
  try { wake = await navigator.wakeLock?.request('screen'); } catch (_) {}
};

resize();
samples.forEach(([n, img, o]) => addCreature(img, n, {...o, scale: o.small ? .14 : .18}));
requestAnimationFrame(loop);
})();
</script>
