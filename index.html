<html lang="ja">
<head>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: full-bleed canvas tank; a collapsible tray floats bottom-left. Single deep-water look on purpose (it is a screen to project on a monitor). */
:root {
  --water-top: #0e5d7a;
  --water-deep: #06243b;
  --sand: #d9c08a;
  --panel: rgba(6, 30, 48, .82);
  --panel-line: rgba(160, 220, 235, .22);
  --ink: #eaf7fb;
  --ink-soft: #a9cfdb;
  --accent: #ffcf5a;
  --danger: #ff8c7a;
  --font-display: "Kiwi Maru", "Hiragino Maru Gothic ProN", "Zen Kaku Gothic New", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; touch-action: pan-x pan-y; } /* scrolling inside the panel is fine, pinch-zoom is not */
body { background: var(--water-deep); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#tank { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }

.tray {
  position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(360px, calc(100vw - 32px));
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 18px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  padding: 16px; display: grid; gap: 12px; max-height: calc(100vh - 32px - env(safe-area-inset-bottom, 0px)); overflow-y: auto;
  transition: opacity .3s, transform .3s;
}
.tray.hide { opacity: 0; transform: translateY(12px); pointer-events: none; }
.tray h1 { font-family: var(--font-display); font-weight: 500; font-size: 22px; margin: 0; letter-spacing: .04em; }
.tray p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink-soft); }
.drop {
  border: 2px dashed var(--panel-line); border-radius: 14px; padding: 10px 6px; align-content: center;
  display: grid; gap: 6px; justify-items: center; text-align: center; cursor: pointer; position: relative;
  transition: border-color .2s, background .2s;
}
.drop:hover, .drop.over { border-color: var(--accent); background: rgba(255, 207, 90, .08); }
.drop strong { font-family: var(--font-display); font-weight: 500; font-size: 16px; color: var(--accent); }
.drop span { font-size: 12px; color: var(--ink-soft); }
/* the real file input covers the drop zone so a finger tap lands on it directly (needed on phones) */
.picker { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row label { font-size: 12px; color: var(--ink-soft); }
input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
button {
  font: inherit; font-size: 13px; color: var(--ink); background: rgba(255,255,255,.08);
  border: 1px solid var(--panel-line); border-radius: 999px; padding: 7px 14px; cursor: pointer;
}
button:hover { background: rgba(255,255,255,.16); }
button:focus-visible, .drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: #2b2000; border-color: transparent; font-weight: 700; }
.list { display: grid; gap: 6px; max-height: 28vh; overflow-y: auto; }
.item { display: flex; align-items: center; gap: 5px; padding: 4px; border-radius: 10px; background: rgba(255,255,255,.04); }
.item img { width: 40px; height: 40px; object-fit: contain; flex: none; background: rgba(255,255,255,.06); border-radius: 8px; }
.item .name { flex: 1; min-width: 0; font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item button { padding: 4px 7px; font-size: 12px; flex: none; }
.item .name.life { font-size: 12px; line-height: 1.4; color: var(--accent); white-space: normal; font-variant-numeric: tabular-nums; }
.item button.del { color: var(--danger); }
.worlds { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.worlds span { grid-column: 1 / -1; font-size: 13px; color: var(--ink-soft); }
.worlds button { padding: 10px 4px; font-size: 15px; border-radius: 14px; white-space: nowrap; }
.worlds button.on { background: var(--accent); color: #2b2000; border-color: transparent; font-weight: 700; }
.count { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.show-btn {
  position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  opacity: .35; background: var(--panel);
}
.show-btn:hover { opacity: 1; }
@media (max-width: 480px) { .tray { padding: 12px; } .tray h1 { font-size: 19px; } }
/* coloring book overlay */
.paint { position: fixed; inset: 0; z-index: 20; background: #06243b; display: grid; grid-template-rows: auto auto minmax(220px, 1fr) auto auto auto auto; overflow-y: auto; gap: 10px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.paint[hidden] { display: none; }
.paint-head { display: flex; align-items: center; gap: 8px; }
.paint-head h2 { font-family: var(--font-display); font-weight: 500; font-size: 20px; margin: 0; flex: 1; }
.paint-go { display: flex; justify-content: center; padding: 14px 0 6px; }
.paint-go button { font-size: 18px; padding: 10px 34px; }
.tpl { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.tpl button { flex: none; padding: 4px; border-radius: 12px; background: #fff; border: 3px solid transparent; }
.tpl button.on { border-color: var(--accent); }
.tpl canvas { display: block; width: 64px; height: 64px; }
.paint-stage { display: flex; justify-content: center; align-items: flex-start; min-height: 0; height: 100%; padding-top: 4px; box-sizing: border-box; }
.paint-board { position: relative; height: min(100%, 92vw, 640px); aspect-ratio: 1; border-radius: 16px; background: #fff; touch-action: none; overflow: hidden; }
.paint-board canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.tools, .colors { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
.tools button.on { background: var(--accent); color: #2b2000; border-color: transparent; font-weight: 700; }
.stamps { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.stamps[hidden] { display: none; }
.stamps button { font-size: 22px; padding: 4px 10px; border-radius: 12px; }
.stamps button.on { background: var(--accent); }
.colors button { width: 38px; height: 38px; padding: 0; border-radius: 50%; border: 3px solid rgba(255,255,255,.35); }
.colors button.on { border-color: #fff; box-shadow: 0 0 0 3px var(--accent); }
.drop-row { display: grid; grid-template-columns: 1fr 112px; gap: 8px; }
.drop-row .drop { min-width: 0; }
.side { display: grid; gap: 8px; }
.side .paint-open { padding: 10px 12px; font-size: 16px; }
.zukan { grid-template-rows: auto auto auto 1fr; }
.ztabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ztabs button { padding: 9px 4px; font-size: 15px; border-radius: 14px; }
.ztabs button.on { background: var(--accent); color: #2b2000; border-color: transparent; font-weight: 700; }
.gcard { background: rgba(255,255,255,.06); border: 1px solid var(--panel-line); border-radius: 14px; padding: 6px; display: grid; gap: 4px; text-align: center; }
.gcard button { padding: 0; border: 0; border-radius: 10px; background: linear-gradient(#1580a0, #0b4d6c); aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; }
.gcard img { max-width: 86%; max-height: 86%; object-fit: contain; }
.gcard small { font-size: 12px; color: var(--ink); line-height: 1.3; min-height: 2.6em; display: grid; place-items: center; }
.gcard.unmet img { filter: brightness(0) opacity(.45); }
.gcard.unmet small { color: var(--ink-soft); }
html[data-world="dino"] .gcard button { background: linear-gradient(#bfe8ff, #9bd27a); }
html[data-world="yokai"] .gcard button { background: linear-gradient(#171340, #6b3f7d); }
html[data-world="princess"] .gcard button { background: linear-gradient(#b493e6, #ffc4dc); }
.zgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; overflow-y: auto; align-content: start; padding-bottom: 8px; }
.zcard { background: rgba(255,255,255,.06); border: 1px solid var(--panel-line); border-radius: 14px; padding: 6px; display: grid; gap: 4px; }
.zpick { padding: 0; border: 0; border-radius: 10px; background: linear-gradient(#1580a0, #0b4d6c); aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; }
.zpick img { max-width: 88%; max-height: 88%; object-fit: contain; }
.zbar { display: flex; align-items: center; gap: 4px; }
.zbar small { flex: 1; font-size: 11px; color: var(--ink-soft); }
.zbar button { padding: 3px 8px; font-size: 12px; }
.zbar button.del { color: var(--danger); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--accent); color: #2b2000; font-weight: 700; padding: 10px 18px; border-radius: 999px; }
.toast[hidden] { display: none; }
.paint-open { font-family: var(--font-display); font-weight: 500; font-size: 15px; border-radius: 14px; padding: 10px 14px; border: 2px dashed var(--panel-line); color: var(--accent); background: transparent; }
@media (max-width: 480px) { .colors button { width: 32px; height: 32px; } .tpl canvas { width: 46px; height: 46px; } .tpl { gap: 6px; } }

</style>

<div id="stage">
  <canvas id="tank" aria-label="絵が泳ぐ水槽"></canvas>
</div>

<section class="tray" id="tray">
  <h1>すいすいスケッチ</h1>
  <p id="desc">スキャンした絵や写真を入れると、白い紙の部分を消して水槽で泳ぎます。お魚をタッチするとジャンプして逃げます。水をタッチすると近くのお魚が見に来ます。30秒ごとにお客さん（マンボウ、カニ、マンタなど）が通りかかります。入れた絵は3分たつとサメが食べに来ます。</p>
  <div class="drop-row">
  <div class="side">
    <button class="paint-open" id="paintOpen">🎨 ぬりえ</button>
    <button class="paint-open" id="zukanOpen">📖 ずかん</button>
  </div>
  <label class="drop" id="drop" tabindex="0">
    <strong>📷<br>絵を入れる</strong>

  </label>

  <div class="worlds" id="worlds"><span>せかい</span><button data-w="sea">🌊 うみ</button><button data-w="dino">🦖 きょうりゅう</button><button data-w="yokai">👻 ようかい</button><button data-w="princess">👑 プリンセス</button></div>
  <div class="row">
    <button class="primary" id="fs">全画面で表示</button>

  </div>
</section>
<button class="show-btn" id="showTray" hidden>パネル</button>

</section>
<div class="toast" id="toast" hidden></div>
<section class="paint" id="paint" hidden aria-label="ぬりえ">
  <div class="paint-head">
    <h2>🎨 ぬりえ</h2>
    <button id="pPrint" title="線画を印刷して紙に塗る">🖨 印刷</button>
    <button id="pClose" aria-label="とじる">✕</button>
  </div>
  <div class="tpl" id="pTpl"></div>
  <div class="paint-stage"><div class="paint-board" id="pBoard"><canvas id="pColor" width="600" height="600"></canvas><canvas id="pLines" width="600" height="600"></canvas></div></div>
  <div class="colors" id="pColors"></div>
  <div class="stamps" id="pStamps" hidden></div>
  <div class="tools">
    <button id="tFill" class="on">🪣 ぬる</button>
    <button id="tPen">✏️ ペン</button>
    <button id="tStamp">⭐ スタンプ</button>
    <button id="tErase">🧽 けす</button>
    <button id="pZoom">🔍 おおきく</button>
    <button id="pUndo">↩ もどす</button>
  </div>
  <div class="paint-go"><button id="pGo" class="primary">🎉 かんせい！</button></div>
</section>


<script>
(() => {
const cv = document.getElementById('tank'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, DPR = 1;
let WORLD = 'sea'; try { const sw = localStorage.getItem('suisui-world'); if (sw === 'dino' || sw === 'yokai' || sw === 'princess') WORLD = sw; } catch (_) {}
const GROUND = () => H * .86; // ground line in the dinosaur world
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildScenery();
}
addEventListener('resize', resize);

/* ---------- scenery ---------- */
let weeds = [], rocks = [];
function buildScenery() {
  const n = Math.max(4, Math.round(W / 140));
  weeds = Array.from({length: n}, (_, i) => ({
    x: (i + .3 + Math.random() * .4) * W / n,
    h: H * (.18 + Math.random() * .22),
    hue: 120 + Math.random() * 40, ph: Math.random() * 6
  }));
  rocks = Array.from({length: Math.round(n * .8)}, () => ({
    x: Math.random() * W, r: 14 + Math.random() * 30, s: 30 + Math.random() * 20
  }));
  dinoScene = null; ykScene = null; prScene = null; deepScene = null; // rebuilt for the new size on the next frame
}
const bubbles = [];
function drawBackground(t) {
  if (WORLD === 'dino') return drawDinoBackground(t);
  if (WORLD === 'yokai') return drawYokaiBackground(t);
  if (WORLD === 'princess') return drawPrincessBackground(t);
  if (DEEP) return drawDeepBackground(t, frameDt);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1580a0'); g.addColorStop(.45, '#0b4d6c'); g.addColorStop(1, '#06243b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // light rays
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const x = (i / 5) * W + Math.sin(t * .0002 + i) * 60;
    const rg = ctx.createLinearGradient(0, 0, 0, H * .8);
    rg.addColorStop(0, 'rgba(180,240,255,.10)'); rg.addColorStop(1, 'rgba(180,240,255,0)');
    ctx.fillStyle = rg; ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x + 70, 0); ctx.lineTo(x + 220, H * .8); ctx.lineTo(x + 90, H * .8); ctx.fill();
  }
  ctx.restore();
  // sand
  const sy = H * .9;
  ctx.fillStyle = '#c9ad74';
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, sy + Math.sin(x * .012) * 8);
  ctx.lineTo(W, H); ctx.fill();
  for (const r of rocks) {
    ctx.fillStyle = `hsl(200,12%,${r.s}%)`;
    ctx.beginPath(); ctx.ellipse(r.x, sy + 10, r.r, r.r * .6, 0, Math.PI, 0); ctx.fill();
  }
  // weeds
  for (const w of weeds) {
    ctx.strokeStyle = `hsl(${w.hue},45%,32%)`; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(w.x, sy + 6);
    const seg = 8;
    for (let i = 1; i <= seg; i++) {
      const k = i / seg, sw = reduce ? 0 : Math.sin(t * .0012 + w.ph + k * 2.4) * 18 * k;
      ctx.lineTo(w.x + sw, sy - w.h * k);
    }
    ctx.stroke();
  }
}
function drawBubbles(dt) {
  const dino = WORLD !== 'sea'; // on land the "bubbles" are little puffs of dust that fade
  if (!dino && !reduce && Math.random() < .08) bubbles.push({x: Math.random() * W, y: H, r: 2 + Math.random() * 6, v: 25 + Math.random() * 40, ph: Math.random() * 6});
  ctx.strokeStyle = 'rgba(220,250,255,.55)'; ctx.lineWidth = 1.5;
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i]; b.y -= b.v * dt; b.ph += dt * 3;
    if (dino) { b.life = (b.life || 1) - dt * 1.2; if (b.life <= 0) { bubbles.splice(i, 1); continue; } ctx.fillStyle = WORLD === 'princess' ? `rgba(255,200,235,${b.life * .8})` : `rgba(250,240,215,${b.life * .7})`; ctx.beginPath(); ctx.arc(b.x + Math.sin(b.ph) * 4, b.y, b.r * (2 - b.life), 0, 7); ctx.fill(); continue; }
    ctx.beginPath(); ctx.arc(b.x + Math.sin(b.ph) * 4, b.y, b.r, 0, 7); ctx.stroke();
    if (b.y < -10) bubbles.splice(i, 1);
  }
}

/* ---------- creatures ---------- */
const creatures = [];
let uid = 0, clock = 0; // clock = seconds the tank has been running (pauses while the page is hidden)
const LIFE = 180;          // drawings you add are eaten by the shark after 3 minutes
const VISIT_EVERY = 30;    // a visitor passes through every 30 seconds
const FIRST_VISIT = 10;
const FAST = Math.max(1, +new URLSearchParams(location.search).get('fast') || 1); // ?fast=30 to try the timers quickly
const MODES = [['swim', '泳ぐ'], ['float', 'ふわふわ'], ['hop', 'はねる']];
const MODE_NAMES = {sea: {swim: '泳ぐ', float: 'ふわふわ', hop: 'はねる'}, dino: {swim: 'あるく', float: 'とぶ', hop: 'はねる'}, yokai: {swim: 'あるく', float: 'ふわふわ', hop: 'はねる'}, princess: {swim: 'おどる', float: 'とぶ', hop: 'はねる'}};
const modeName = m => MODE_NAMES[WORLD][m];
function addCreature(img, name, opts = {}) {
  const base = Math.min(W, H) * (opts.scale || .2);
  const ar = img.width / img.height;
  const w = ar >= 1 ? base : base * ar, h = ar >= 1 ? base / ar : base;
  const c = {
    id: ++uid, img, name, w, h, mode: opts.mode || 'swim', flip: !!opts.flip,
    x: Math.random() * (W - w) + w / 2, y: H * (.2 + Math.random() * .5),
    vx: (Math.random() < .5 ? -1 : 1) * (40 + Math.random() * 40), vy: 0,
    ph: Math.random() * 6, jump: 0, turn: 0, dir: 1,
    user: !!opts.user, born: clock, fear: false, si: 0, princess: !!opts.princess
  };
  if (opts.si === 2) { c.w *= .7; c.h *= .7; c.si = 2; } // start at the small size (the list button then offers 中)
  c.dir = Math.sign(c.vx);
  if (opts.at) {
    c.x = Math.min(W - w / 2, Math.max(w / 2, opts.at.x + (Math.random() - .5) * 60));
    c.y = Math.min(H * .9 - h / 2, Math.max(H * .08 + h / 2, opts.at.y + (Math.random() - .5) * 60));
    c.jump = 1;
  }
  creatures.push(c); renderList();
}
function update(c, dt, t) {
  const floor = WORLD !== 'sea' ? GROUND() : H * .9, top = H * .08;
  c.ph += dt;
  if (c.jump > 0) c.jump = Math.max(0, c.jump - dt * 1.6);
  if (c.launch) return; // flying off after the eruption (moved in the loop)
  if (c.dance) { if (visitors.includes(c.dance.v) && c.dance.v.dance) { if (c.twirl > 0) c.twirl = Math.max(0, c.twirl - dt * 1.1); c.dir += ((Math.sign(c.dir) || 1) - c.dir) * Math.min(1, dt * 8); return; } c.dance = null; } // dancing with a prince
  if (c.fear) { // the shark is coming: freeze and tremble
    c.x += Math.sin(c.ph * 60) * 1.2; c.vx = Math.sign(c.vx) * 10; c.vy = 0;
    c.dir += ((Math.sign(c.vx) || 1) - c.dir) * Math.min(1, dt * 5);
    return;
  }
  if (c.cold > 0) { // blown by the snow woman: shiver, then sneeze
    c.cold = Math.max(0, c.cold - dt); c.x += Math.sin(c.ph * 55) * 1.1;
    if (!c.cold) { c.jump = 1; c.boost = 2; }
  }
  if (c.spin > 0) c.spin = Math.max(0, c.spin - dt * 1.4);
  if (c.twirl > 0) c.twirl = Math.max(0, c.twirl - dt * 1.1); // a pirouette (princess world)
  if (c.crown > 0) c.crown = Math.max(0, c.crown - dt);
  c.boost = Math.max(0, (c.boost || 0) - dt * 2.5);
  const sp = 1 + c.boost; // speed burst after being tapped
  const tg = c.target;
  if (tg) { // come over to look at the ripple
    tg.t -= dt;

/* screens and the browser's back button: each opened screen (panel, ぬりえ, ずかん) is a history entry,
   so ◀ closes the screen on top instead of leaving the page. state = {stack: [...screens], d: depth} */
const NAV = (() => {
  const st = () => (history.state && history.state.stack) || [];
  const depth = () => (history.state && history.state.d) || 0;
  function apply() {
    const s = st(), topS = s[s.length - 1];
    tray.classList.toggle('hide', !s.includes('tray')); showBtn.hidden = s.includes('tray');
    document.getElementById('paint').hidden = topS !== 'paint';
    document.getElementById('zukan').hidden = topS !== 'zukan';
  }
  let after = null;
  addEventListener('popstate', () => { apply(); const f = after; after = null; if (f) f(); });
  return {
    apply,
    open(name) { if (st()[st().length - 1] === name) return; history.pushState({stack: [...st(), name], d: depth() + 1}, ''); apply(); },
    close(name, then) { // close the top screen (or the panel)
      const s = st();
      if (!s.includes(name)) { if (then) then(); return; }
      if (s[s.length - 1] === name && depth() > 0) { after = then || null; history.back(); return; }
      history.replaceState({stack: s.filter(x => x !== name), d: depth()}, ''); apply(); if (then) then();
    },
  };
})();
history.replaceState({stack: tray.classList.contains('hide') ? [] : ['tray'], d: 0}, '');

const ZUKAN = (() => {
  const MAX = 300;

    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);

  const store = async (mode) => (await db()).transaction('drawings', mode).objectStore('drawings');
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

/* walking / flying for drawings in the dinosaur world ("swim" = walk, "float" = fly) */
function updateDinoMove(c, dt, sp, tg) {
  const G = GROUND();
  if (c.mode === 'swim') { // walk on the ground, stop now and then
    if (c.pause > 0) c.pause -= dt;
    else {
      c.x += c.vx * .8 * sp * dt; c.walk = (c.walk || 0) + dt * 9;
      if (!tg && !c.boost && Math.random() < dt * .12) { c.pause = .8 + Math.random() * 1.6; if (WORLD === 'princess') c.twirl = 1; } // princesses stop to twirl
      if (!tg && !c.boost && Math.random() < dt * .05) c.vx *= -1;
    }
    c.y += ((G - c.h / 2 + 4) - Math.abs(Math.sin(c.walk || 0)) * c.h * .05 - c.y) * Math.min(1, dt * 10);
  } else { // fly through the sky
    if (!c.alt || Math.random() < dt * .1) c.alt = H * (.1 + Math.random() * .38);
    const goal = tg ? tg.y : c.alt;
    const ghost = WORLD === 'yokai' || WORLD === 'princess';
    if (WORLD === 'princess' && Math.random() < dt * 4) fx.push({k: 'spark', x: c.x - c.dir * c.w * .4, y: c.y + (Math.random() - .5) * c.h * .5, vx: 0, vy: 10, a: .7, s: Math.max(4, c.w * .04)});
    c.x += c.vx * (ghost ? .5 : 1.15) * sp * dt;
    c.vy += ((goal + Math.sin(c.ph * 1.6) * (ghost ? 45 : 30) - c.y) * 1.2 - c.vy) * Math.min(1, dt * 2);
    c.y += c.vy * dt;
    if (!tg && !c.boost && Math.random() < dt * .04) c.vx *= -1;
    c.y = Math.min(G - c.h / 2, Math.max(c.h / 2, c.y));
  }
  if (c.x - c.w / 2 < 0) { c.x = c.w / 2; c.vx = Math.abs(c.vx); }
  if (c.x + c.w / 2 > W) { c.x = W - c.w / 2; c.vx = -Math.abs(c.vx); }
  const want = Math.sign(c.vx) || 1;
  c.dir += (want - c.dir) * Math.min(1, dt * 5);
}

const parked = {sea: [], dino: [], yokai: [], princess: []}; // drawings of the worlds that are not on screen

function setWorld(w) {
  const from = WORLD === w ? null : WORLD;
  WORLD = w; try { localStorage.setItem('suisui-world', w); } catch (_) {}
  DEEP = false; diveT = null;
  visitors.length = 0; shark = null; erupt = null; dawn = null; midnight = null; lava.length = 0; bubbles.length = 0; fx.length = 0;
  nextVisit = clock + 6;
  // each world keeps its own drawings: put this world's away (their 3-minute timer pauses) and bring the other's back
  const leaving = creatures.filter(c => c.user);
  for (const c of creatures) { c.ascend = null; if (c.hidden || c.abduct || c.drop) { c.hidden = false; c.abduct = false; c.drop = null; c.shrink = 1; c.spin2 = 0; c.y = GROUND() - c.h / 2; } }
  for (const c of leaving) { c.fear = false; c.launch = null; c.awayAt = clock; }
  const back = parked[w] || [];
  for (const c of back) { c.born += clock - c.awayAt; c.fear = false; c.launch = null; }
  if (from) parked[from] = leaving; parked[w] = [];
  creatures.length = 0; creatures.push(...back);

}

    c.ascend = {a: 1, home: true, dir}; c.vx = dir * 100; c.dir = dir; c.flip = false;

  for (const [u, v] of [[.4, 0], [.2, -.08], [.2, .08], [0, -.05], [0, .05], [-.45, 0]]) { x.beginPath(); x.arc(u * s, v * s, s * (.05 + flash * .03), 0, 7); x.fill(); }
  x.restore();
}

// no pinch-zoom or double-tap zoom anywhere (iOS Safari ignores user-scalable=no, so block the gestures too)
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive: false});
let lastTouchEnd = 0;
document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouchEnd < 300 && e.target === cv) e.preventDefault(); lastTouchEnd = now; }, {passive: false});
resize();
SAMPLES().forEach(([n, img, o]) => addCreature(img, n, {...o, scale: o.small ? .14 : .18}));
showWorld();
requestAnimationFrame(loop);
})();
</script>
